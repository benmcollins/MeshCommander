# Copyright (C) 2026 Ben Collins <ben@ironrocketsmc.org>
#
# Build and publish a release on `vX.Y.Z` tag pushes.
#
# Each platform job:
#   1. installs Qt + Ninja + OpenSSL (same as CI),
#   2. configures + builds in Release mode,
#   3. runs the test suite as a smoke check,
#   4. runs `cpack` to produce a .dmg (macOS) or NSIS .exe (Windows),
#   5. uploads the artifact.
#
# The final job downloads both artifacts and publishes a GitHub Release.
#
# Signing/notarization is gated on the existence of repo secrets; until
# those are populated, the release ships unsigned. See `app/CMakeLists.txt`
# for the signing stubs and the README for how to provision secrets.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            artifact: QuMesh-macos.dmg
            cpack_generator: DragNDrop
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
            artifact: QuMesh-windows.exe
            cpack_generator: NSIS

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools'
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # NSIS used to ship with windows-latest images but the
          # 2026 image dropped it. Pull it in explicitly so CPack
          # can drive `makensis`.
          if ! command -v makensis >/dev/null 2>&1; then
            choco install -y --no-progress nsis
          fi
          # The choco install lands NSIS under "C:\Program Files (x86)\NSIS".
          echo "C:\\Program Files (x86)\\NSIS" >> $GITHUB_PATH

      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Install libssh (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libssh
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libssh)${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> $GITHUB_ENV

      - name: Import Developer ID cert into per-job keychain (macOS)
        if: runner.os == 'macOS' && env.MAC_DEVELOPER_ID_P12_BASE64 != ''
        env:
          MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners start with empty user keychains, so
          # codesign can't find a Developer ID identity. Create a
          # disposable keychain for this job, import the .p12, then
          # set-key-partition-list so codesign can use the private key
          # without an interactive prompt.
          CERT_PATH=$(mktemp -d)/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          printf '%s' "$MAC_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
              -P "$MAC_DEVELOPER_ID_P12_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          # Put our keychain first in the search path so codesign sees
          # the imported identity. Re-include the existing user list so
          # Apple's root certs remain reachable for chain validation.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
              $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list \
              -S "apple-tool:,apple:,codesign:" \
              -s -k "$KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # Fetch the prebuilt openssl + libssh tarball published by
      # `.github/workflows/build-windeps.yml` — same fast path the CI
      # workflow uses, see #196. Bump WINDEPS_TAG + WINDEPS_SHA256
      # (here and in ci.yml) when refreshing the bundled dep versions.
      - name: Fetch prebuilt openssl + libssh (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDEPS_TAG: windeps-v1
          WINDEPS_SHA256: 187cf10bc46c282ae231c772f559587e92c18c4a2e8db6ff08462e7bc315c4c4
        run: |
          set -euo pipefail
          # See ci.yml for the path-mangling rationale: forward-slash
          # the Windows-form $RUNNER_TEMP and pair with --force-local.
          RT="${RUNNER_TEMP//\\//}"
          VERSION=${WINDEPS_TAG#windeps-}
          URL="https://github.com/${{ github.repository }}/releases/download/${WINDEPS_TAG}/qumesh-windeps-x64-windows-${VERSION}.tar.gz"
          curl -sSL "$URL" -o "$RT/windeps.tar.gz"
          echo "$WINDEPS_SHA256  $RT/windeps.tar.gz" | sha256sum -c -
          mkdir -p "$RT/windeps"
          tar --force-local -xzf "$RT/windeps.tar.gz" -C "$RT/windeps"
          # See ci.yml — libssh's bundled debug-config stub references
          # files we slim out, so delete it to leave only the release.
          rm -f "$RT/windeps/x64-windows/share/libssh/libssh-config-debug.cmake"
          echo "CMAKE_PREFIX_PATH=$RT/windeps/x64-windows" >> $GITHUB_ENV

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test (smoke, macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: build
        run: ctest --output-on-failure --parallel

      - name: Test (smoke, Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: build
        run: |
          rem See ci.yml — test exes need windeps DLLs on PATH and
          rem we do the prepend in native cmd to avoid bash→cmd PATH
          rem translation surprises.
          set "PATH=%RUNNER_TEMP%\windeps\x64-windows\bin;%PATH%"
          ctest --output-on-failure --parallel

      - name: Package
        shell: bash
        working-directory: build
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          WIN_SIGN_THUMBPRINT: ${{ secrets.WIN_SIGN_THUMBPRINT }}
        run: cpack -G ${{ matrix.cpack_generator }} --verbose

      - name: Smoke-launch bundled app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: build
        env:
          QUMESH_SMOKE_EXIT_MS: '3000'
          QT_QPA_PLATFORM: offscreen
        run: |
          # CPack stages the .app under _CPack_Packages/Darwin/DragNDrop/<name>/
          STAGED=$(find _CPack_Packages -maxdepth 6 -name 'QuMesh.app' -type d | head -1)
          if [ -z "$STAGED" ]; then
            echo "Could not locate staged QuMesh.app" >&2
            exit 1
          fi
          echo "Smoke-launching $STAGED"
          # macOS doesn't ship GNU `timeout`; rely on the app's
          # built-in QUMESH_SMOKE_EXIT_MS handler to self-exit,
          # with a shell-level kill -9 backstop after 60 s.
          "$STAGED/Contents/MacOS/QuMesh" &
          APP_PID=$!
          ( sleep 60 && kill -9 $APP_PID 2>/dev/null ) &
          GUARD_PID=$!
          if wait $APP_PID; then
            kill -9 $GUARD_PID 2>/dev/null
            exit 0
          else
            RC=$?
            kill -9 $GUARD_PID 2>/dev/null
            exit $RC
          fi

      - name: Smoke-launch bundled app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: build
        env:
          QUMESH_SMOKE_EXIT_MS: '3000'
          QT_QPA_PLATFORM: offscreen
        run: |
          STAGED=$(find _CPack_Packages -maxdepth 6 -name 'QuMesh.exe' -type f | head -1)
          if [ -z "$STAGED" ]; then
            echo "Could not locate staged QuMesh.exe" >&2
            exit 1
          fi
          echo "Smoke-launching $STAGED"
          # GNU timeout doesn't propagate Windows exit codes well; rely
          # on the process exiting on its own under QUMESH_SMOKE_EXIT_MS.
          "$STAGED" &
          APP_PID=$!
          # Hard backstop: kill after 60s if it hasn't exited.
          ( sleep 60 && kill -9 $APP_PID 2>/dev/null ) &
          GUARD_PID=$!
          if wait $APP_PID; then
            kill -9 $GUARD_PID 2>/dev/null
            exit 0
          else
            RC=$?
            kill -9 $GUARD_PID 2>/dev/null
            exit $RC
          fi

      - name: Sign update for WinSparkle (Windows, when secret provisioned)
        if: runner.os == 'Windows' && env.SPARKLE_ED_PRIVATE_KEY != ''
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        working-directory: build
        run: |
          # Pull the same WinSparkle zip CMake fetches; we need
          # bin/winsparkle-tool.exe to sign the installer with the
          # EdDSA private key. The .zip is ~10 MB. Sparkle and
          # WinSparkle share key format, so the same
          # SPARKLE_ED_PRIVATE_KEY signs both platforms.
          WS_VER=0.9.2
          WS_URL="https://github.com/vslavik/winsparkle/releases/download/v${WS_VER}/WinSparkle-${WS_VER}.zip"
          curl -sL "$WS_URL" -o /tmp/winsparkle.zip
          mkdir -p /tmp/winsparkle
          7z x -y -o/tmp/winsparkle /tmp/winsparkle.zip > /dev/null
          TOOL="/tmp/winsparkle/WinSparkle-${WS_VER}/bin/winsparkle-tool.exe"
          KEY_FILE=$(mktemp)
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          EXE=$(ls QuMesh-*-windows-x64.exe | head -1)
          # `winsparkle-tool sign` prints only the raw base64 signature
          # to stdout — unlike Sparkle's `sign_update`, which emits a
          # ready-to-paste `sparkle:edSignature="..." length="..."`
          # fragment. Strip any trailing whitespace (Windows tools love
          # to tack on a CRLF) so the wrap below produces a quoted
          # attribute with no embedded newline.
          SIG=$("$TOOL" sign --private-key-file "$KEY_FILE" "$EXE" | tr -d '[:space:]')
          rm -f "$KEY_FILE"
          LENGTH=$(stat -c '%s' "$EXE" 2>/dev/null || stat -f '%z' "$EXE")
          mkdir -p "$GITHUB_WORKSPACE/appcast"
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          EXE_NAME=$(basename "$EXE")
          PUBDATE=$(LC_ALL=en_US.UTF-8 date -u +"%a, %d %b %Y %H:%M:%S +0000")
          # Description block is filled in by the publish job — see the
          # corresponding comment in the macOS signing step.
          {
            echo "<item>"
            echo "  <title>$VERSION</title>"
            echo "  <pubDate>$PUBDATE</pubDate>"
            echo "  <sparkle:os>windows</sparkle:os>"
            echo "  __NOTES_HTML_PLACEHOLDER__"
            echo "  <enclosure url=\"https://github.com/${{ github.repository }}/releases/download/${TAG}/${EXE_NAME}\""
            echo "             sparkle:version=\"$VERSION\""
            echo "             sparkle:os=\"windows\""
            echo "             length=\"$LENGTH\""
            echo "             sparkle:edSignature=\"$SIG\""
            echo "             type=\"application/octet-stream\" />"
            echo "</item>"
          } > "$GITHUB_WORKSPACE/appcast/item-windows.xml"

      - name: Upload appcast fragment (Windows)
        if: runner.os == 'Windows' && env.SPARKLE_ED_PRIVATE_KEY != ''
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: appcast-fragment-windows
          path: appcast/item-windows.xml
          if-no-files-found: error

      - name: Notarize (macOS, when secret provisioned)
        if: runner.os == 'macOS' && env.MAC_NOTARIZE_APPLE_ID != ''
        env:
          MAC_NOTARIZE_APPLE_ID: ${{ secrets.MAC_NOTARIZE_APPLE_ID }}
          MAC_NOTARIZE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM_ID }}
          MAC_NOTARIZE_PASSWORD: ${{ secrets.MAC_NOTARIZE_PASSWORD }}
        shell: bash
        working-directory: build
        run: |
          DMG=$(ls QuMesh-*-macos.dmg | head -1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$MAC_NOTARIZE_APPLE_ID" \
            --team-id "$MAC_NOTARIZE_TEAM_ID" \
            --password "$MAC_NOTARIZE_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Sign update for Sparkle (macOS, when secret provisioned)
        # MUST run after the Notarize step above. xcrun stapler staple
        # rewrites the DMG to embed the notarization ticket, which
        # changes its bytes and hash; signing before stapling produced
        # a signature over the pre-staple file that no longer matched
        # what users downloaded, and Sparkle correctly rejected the
        # update with "improperly signed" (#211). Signing the final
        # stapled file makes the recorded length and signature describe
        # exactly the bytes that get published.
        if: runner.os == 'macOS' && env.SPARKLE_ED_PRIVATE_KEY != ''
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        working-directory: build
        run: |
          # Pull the same Sparkle tarball CMake fetches; we only need
          # bin/sign_update from it. Cache-friendly: tar.xz is < 14 MB.
          SPARKLE_VER=2.6.4
          SPARKLE_URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz"
          curl -sL "$SPARKLE_URL" -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          KEY_FILE=$(mktemp)
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          DMG=$(ls QuMesh-*-macos.dmg | head -1)
          # sign_update prints `sparkle:edSignature="..." length="..."`
          # straight to stdout; capture it for the appcast item below.
          SIG=$(/tmp/sparkle/bin/sign_update "$DMG" --ed-key-file "$KEY_FILE")
          rm -f "$KEY_FILE"
          # Stash the bits the publish job needs to assemble appcast.xml.
          # Step runs with working-directory: build, so `..` is the
          # repo root — upload-artifact resolves its `path:` the same way.
          mkdir -p "$GITHUB_WORKSPACE/appcast"
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          DMG_NAME=$(basename "$DMG")
          PUBDATE=$(LC_ALL=en_US.UTF-8 date -u +"%a, %d %b %Y %H:%M:%S +0000")
          # The description block is filled in by the publish job: it
          # reads app/release-notes/<TAG>.md (or falls back to the tag
          # annotation), renders Markdown → HTML via pandoc, and
          # substitutes the placeholder below. Keeping rendering in
          # one place (publish, ubuntu-latest) avoids installing pandoc
          # on macOS + Windows runners just to do the same conversion
          # twice.
          {
            echo "<item>"
            echo "  <title>$VERSION</title>"
            echo "  <pubDate>$PUBDATE</pubDate>"
            echo "  <sparkle:os>macos</sparkle:os>"
            echo "  __NOTES_HTML_PLACEHOLDER__"
            echo "  <enclosure url=\"https://github.com/${{ github.repository }}/releases/download/${TAG}/${DMG_NAME}\""
            echo "             sparkle:version=\"$VERSION\""
            echo "             sparkle:os=\"macos\""
            echo "             $SIG"
            echo "             type=\"application/octet-stream\" />"
            echo "</item>"
          } > "$GITHUB_WORKSPACE/appcast/item-macos.xml"

      - name: Upload appcast fragment (macOS)
        if: runner.os == 'macOS' && env.SPARKLE_ED_PRIVATE_KEY != ''
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: appcast-fragment-macos
          path: appcast/item-macos.xml
          if-no-files-found: error

      - name: Collect artifact
        shell: bash
        working-directory: build
        run: |
          # Step runs with working-directory: build, so write to
          # $GITHUB_WORKSPACE/artifacts/ — that matches what
          # upload-artifact reads relative to the repo root.
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp QuMesh-*-macos.dmg "$GITHUB_WORKSPACE/artifacts/"
          else
            cp QuMesh-*-windows-x64.exe "$GITHUB_WORKSPACE/artifacts/"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qumesh-${{ runner.os }}
          path: artifacts/*
          if-no-files-found: error

  # Linux .deb builds run inside the target distro's container so the
  # shlibdeps resolved by CPack DEB are accurate for that distro. Ubuntu
  # 26.04 and Debian 13 both ship Qt 6.8 + libssh 0.11 with compatible
  # dep strings; the .debs aren't strictly distro-locked, but matching
  # the build container to the target stops us from quietly shipping
  # libfoo.so.4 deps that only resolve on whichever distro we built in.
  #
  # The matrix doubles up on architecture: amd64 jobs run on the
  # standard `ubuntu-latest` runners, arm64 jobs on GH's native
  # `ubuntu-24.04-arm` runners (free for public repos since 2025).
  # No QEMU emulation — native builds are 5-10x faster and arm64
  # users get binaries with arm64-resolved shlibdeps.
  build-linux:
    name: Build (${{ matrix.distro_label }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ${{ matrix.container_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container_image: 'ubuntu:26.04'
            distro_label: 'Ubuntu 26.04'
            distro_tag: ubuntu26.04
            arch: amd64
            runs_on: ubuntu-latest
          - container_image: 'ubuntu:26.04'
            distro_label: 'Ubuntu 26.04'
            distro_tag: ubuntu26.04
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - container_image: 'debian:13'
            distro_label: 'Debian 13'
            distro_tag: debian13
            arch: amd64
            runs_on: ubuntu-latest
          - container_image: 'debian:13'
            distro_label: 'Debian 13'
            distro_tag: debian13
            arch: arm64
            runs_on: ubuntu-24.04-arm

    steps:
      # `actions/checkout` needs git + ca-certificates inside the
      # container, neither of which the minimal images ship. Install
      # the toolchain first; the checkout then works normally.
      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git ca-certificates curl \
            cmake ninja-build build-essential \
            python3 file \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-tools-dev \
            libqt6svg6-dev \
            libssh-dev libssl-dev \
            dpkg-dev

      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test (smoke)
        shell: bash
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --parallel

      - name: Package (.deb)
        shell: bash
        working-directory: build
        run: cpack -G DEB --verbose

      - name: Verify .deb doesn't bundle Qt
        shell: bash
        working-directory: build
        run: |
          set -eux
          # Belt-and-braces against the regression in #256: if anyone
          # re-introduces qt_generate_deploy_qml_app_script on Linux,
          # the .deb will contain Qt's QML plugin tree at
          # /usr/lib/<triplet>/qt6/. Fail loudly before we publish.
          DEB=$(ls qumesh_*.deb | head -1)
          if dpkg-deb -c "$DEB" | grep -q '/qt6/'; then
            echo "::error::$DEB contains /qt6/ paths — Qt is being bundled. See #256."
            dpkg-deb -c "$DEB" | grep '/qt6/'
            exit 1
          fi

      - name: Smoke-install + launch
        shell: bash
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
          QUMESH_SMOKE_EXIT_MS: '3000'
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          DEB=$(ls qumesh_*.deb | head -1)
          # `apt-get install ./<file>.deb` resolves transitive deps
          # against the configured archive — closest to what a user
          # running `apt install qumesh` from our APT repo will see.
          apt-get install -y "./$DEB"
          # Same pattern macOS/Windows use: rely on the in-app
          # QUMESH_SMOKE_EXIT_MS handler to self-exit, with a kill -9
          # backstop after 60 s.
          QuMesh-app &
          APP_PID=$!
          ( sleep 60 && kill -9 $APP_PID 2>/dev/null ) &
          GUARD_PID=$!
          if wait $APP_PID; then
            kill -9 $GUARD_PID 2>/dev/null
            exit 0
          else
            RC=$?
            kill -9 $GUARD_PID 2>/dev/null
            exit $RC
          fi

      - name: Collect artifact
        shell: bash
        working-directory: build
        run: |
          # CPack outputs qumesh_<version>_<arch>.deb where <arch> is
          # whatever `dpkg --print-architecture` returns in the build
          # container. Rename with both the distro tag and the arch so
          # all four combinations can coexist as release assets and
          # users can see at a glance which one matches their system.
          DEB_ARCH=$(dpkg --print-architecture)
          ORIG=$(ls qumesh_*_"${DEB_ARCH}".deb | head -1)
          NEW="${ORIG%_${DEB_ARCH}.deb}-${{ matrix.distro_tag }}_${DEB_ARCH}.deb"
          mv "$ORIG" "$NEW"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$NEW" "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qumesh-${{ matrix.distro_tag }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint + pandoc
        # libxml2-utils ships xmllint, used by the Assemble step to
        # validate the previous + final appcast.xml. Not pre-installed
        # on ubuntu-latest as of 2026-05; without this step the
        # validation degrades into `command not found` and the publish
        # step fails (#208 follow-up).
        #
        # pandoc renders the per-version Markdown release notes
        # (app/release-notes/<TAG>.md) into the HTML that Sparkle's
        # WebKit description view actually displays. Centralising
        # rendering here lets the per-OS build jobs stay rendering-
        # agnostic — they emit a placeholder in their fragment and
        # the substitute step below fills it in.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils pandoc

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: qumesh-macOS
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: qumesh-Windows
          path: dist/

      - name: Download Ubuntu 26.04 (amd64) artifact
        uses: actions/download-artifact@v4
        with:
          name: qumesh-ubuntu26.04-amd64
          path: dist/

      - name: Download Ubuntu 26.04 (arm64) artifact
        uses: actions/download-artifact@v4
        with:
          name: qumesh-ubuntu26.04-arm64
          path: dist/

      - name: Download Debian 13 (amd64) artifact
        uses: actions/download-artifact@v4
        with:
          name: qumesh-debian13-amd64
          path: dist/

      - name: Download Debian 13 (arm64) artifact
        uses: actions/download-artifact@v4
        with:
          name: qumesh-debian13-arm64
          path: dist/

      - name: Download Sparkle appcast fragment (if produced)
        uses: actions/download-artifact@v4
        with:
          name: appcast-fragment-macos
          path: appcast/
        continue-on-error: true

      - name: Download WinSparkle appcast fragment (if produced)
        uses: actions/download-artifact@v4
        with:
          name: appcast-fragment-windows
          path: appcast/
        continue-on-error: true

      - name: Render release notes (Markdown → HTML)
        # Source precedence: `app/release-notes/<TAG>.md` (e.g.
        # v1.1.3.md), else a bare `<VERSION>.md` (e.g. 1.1.3.md), else
        # the git tag annotation. The tag annotation is engineering-
        # oriented (issue numbers, CI details, file paths); the
        # per-version Markdown file is where prose for end users
        # lives. Adding a new release without that file emits a
        # ::warning:: and falls back so we never block a release on
        # a missing notes file — but the warning makes the omission
        # visible in the run log so it can be addressed next time.
        #
        # Substitutes `__NOTES_HTML_PLACEHOLDER__` (emitted by the
        # per-OS sign steps) with a real <description> block carrying
        # the rendered HTML inside CDATA. Sparkle's description view
        # is WebKit, so anything pandoc emits (headings, lists,
        # fenced code, links, emphasis) renders.
        if: hashFiles('appcast/item-macos.xml') != '' || hashFiles('appcast/item-windows.xml') != ''
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          NOTES_MD=""
          if [ -f "app/release-notes/${TAG}.md" ]; then
            NOTES_MD=$(cat "app/release-notes/${TAG}.md")
            echo "Using app/release-notes/${TAG}.md as release notes."
          elif [ -f "app/release-notes/${VERSION}.md" ]; then
            NOTES_MD=$(cat "app/release-notes/${VERSION}.md")
            echo "Using app/release-notes/${VERSION}.md as release notes."
          else
            NOTES_MD=$(git tag -l --format='%(contents)' "$TAG")
            echo "::warning::No app/release-notes/${TAG}.md or ${VERSION}.md found; falling back to git tag annotation."
          fi
          if [ -z "$NOTES_MD" ]; then NOTES_MD="QuMesh $TAG"; fi

          NOTES_HTML=$(printf '%s\n' "$NOTES_MD" | pandoc -f gfm -t html)

          for fragment in appcast/item-macos.xml appcast/item-windows.xml; do
            if [ -f "$fragment" ]; then
              awk -v html="$NOTES_HTML" '
                /__NOTES_HTML_PLACEHOLDER__/ {
                  print "  <description><![CDATA["
                  print html
                  print "  ]]></description>"
                  next
                }
                { print }
              ' "$fragment" > "$fragment.tmp" && mv "$fragment.tmp" "$fragment"
            fi
          done

          echo "--- Rendered fragments ---"
          for fragment in appcast/item-macos.xml appcast/item-windows.xml; do
            [ -f "$fragment" ] && { echo "=== $fragment ==="; cat "$fragment"; }
          done

      - name: Assemble appcast (macOS + Windows)
        if: hashFiles('appcast/item-macos.xml') != '' || hashFiles('appcast/item-windows.xml') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull the previous release's appcast.xml (if any) and prepend
          # the new <item>s so the in-app "what's new" history grows
          # over time. First-ever release: prior fetch fails, we start
          # fresh. Each item carries sparkle:os so Sparkle and
          # WinSparkle each pick the entries that match their platform.
          #
          # Validate the previous feed before forwarding its items. If
          # a prior release ever published malformed XML (the v1.1.0
          # bare-base64-signature bug, #206 / #208), unconditionally
          # carrying its <item> blocks forward keeps every subsequent
          # release malformed. xmllint failure here drops the historical
          # entries from that release backward — the lesser harm than
          # propagating broken XML forever.
          PREV_ITEMS=""
          if gh release download --repo "${{ github.repository }}" \
                                  --pattern appcast.xml \
                                  --dir prev_appcast 2>/dev/null; then
            if xmllint --noout prev_appcast/appcast.xml 2>/tmp/prev_xmllint.err; then
              PREV_ITEMS=$(awk '/<item>/,/<\/item>/' prev_appcast/appcast.xml)
            else
              echo "::warning::Previous appcast.xml is not well-formed XML; starting feed history fresh. xmllint output:" >&2
              cat /tmp/prev_xmllint.err >&2
            fi
          fi
          NEW_ITEMS=""
          for fragment in appcast/item-macos.xml appcast/item-windows.xml; do
            if [ -f "$fragment" ]; then
              NEW_ITEMS="${NEW_ITEMS}$(cat "$fragment")
          "
            fi
          done
          mkdir -p dist
          cat > dist/appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>QuMesh</title>
              <link>https://github.com/${{ github.repository }}</link>
              <description>QuMesh release feed</description>
              <language>en</language>
          ${NEW_ITEMS}
          ${PREV_ITEMS}
            </channel>
          </rss>
          APPCAST

          # Refuse to publish a malformed feed. Without this guard the
          # publish step happily uploads broken XML and the regression
          # is invisible until a user hits Check for Updates and sees
          # Sparkle's parse-error dialog (see #206 / #208).
          if ! xmllint --noout dist/appcast.xml 2>/tmp/final_xmllint.err; then
            echo "::error::Assembled dist/appcast.xml is not well-formed XML; refusing to publish." >&2
            cat /tmp/final_xmllint.err >&2
            echo "--- dist/appcast.xml ---" >&2
            cat -n dist/appcast.xml >&2
            exit 1
          fi

      - name: List artifacts
        run: ls -la dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          QuMesh $TAG
          ============

          Native Qt6 console for Intel AMT (vPro) devices.

          - **macOS** — drag QuMesh.app from the .dmg to Applications.
            On first launch Gatekeeper will warn that the bundle is
            unsigned; right-click → Open to bypass.
          - **Windows** — run the .exe installer. SmartScreen will warn
            that the publisher is unverified; click "More info" →
            "Run anyway".
          - **Linux (Debian 13 / Ubuntu 26.04, amd64 or arm64)** — preferred
            path is the APT repo so apt handles upgrades. The snippet picks
            the right suite (\`ubuntu26.04\` / \`debian13\`) from
            \`/etc/os-release\`:

                . /etc/os-release
                SUITE="\${ID}\${VERSION_ID}"

                curl -fsSL https://benmcollins.github.io/QuMesh/apt-pub.asc | \\
                    sudo tee /etc/apt/keyrings/qumesh.asc > /dev/null
                echo "deb [signed-by=/etc/apt/keyrings/qumesh.asc] \\
                    https://benmcollins.github.io/QuMesh \$SUITE main" | \\
                    sudo tee /etc/apt/sources.list.d/qumesh.list
                sudo apt update && sudo apt install qumesh

            Or grab the matching \`.deb\` below and \`sudo apt install ./qumesh_*.deb\`.

          See [the changelog](https://github.com/${{ github.repository }}/compare/...$TAG)
          for what changed.
          EOF
          gh release create "$TAG" \
            --title "QuMesh $TAG" \
            --notes-file "$NOTES_FILE" \
            dist/*
