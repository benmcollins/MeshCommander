#
# Build and publish a release on `vX.Y.Z` tag pushes.
#
# Each platform job:
#   1. installs Qt + Ninja + OpenSSL (same as CI),
#   2. configures + builds in Release mode,
#   3. runs the test suite as a smoke check,
#   4. runs `cpack` to produce a .dmg (macOS) or NSIS .exe (Windows),
#   5. uploads the artifact.
#
# The final job downloads both artifacts and publishes a GitHub Release.
#
# Signing/notarization is gated on the existence of repo secrets; until
# those are populated, the release ships unsigned. See `qt/app/CMakeLists.txt`
# for the signing stubs and the README for how to provision secrets.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            artifact: QuMesh-macos.dmg
            cpack_generator: DragNDrop
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
            artifact: QuMesh-windows.exe
            cpack_generator: NSIS

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools'
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # NSIS used to ship with windows-latest images but the
          # 2026 image dropped it. Pull it in explicitly so CPack
          # can drive `makensis`.
          if ! command -v makensis >/dev/null 2>&1; then
            choco install -y --no-progress nsis
          fi
          # The choco install lands NSIS under "C:\Program Files (x86)\NSIS".
          echo "C:\\Program Files (x86)\\NSIS" >> $GITHUB_PATH

      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Locate OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -d "/c/Program Files/OpenSSL-Win64" ]; then
            echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL-Win64" >> $GITHUB_ENV
          elif [ -d "/c/Program Files/OpenSSL" ]; then
            echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL" >> $GITHUB_ENV
          else
            choco install -y --no-progress openssl
            echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL-Win64" >> $GITHUB_ENV
          fi

      - name: Configure
        shell: bash
        working-directory: qt
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        working-directory: qt
        run: cmake --build build --parallel

      - name: Test (smoke)
        shell: bash
        working-directory: qt/build
        run: ctest --output-on-failure --parallel

      - name: Package
        shell: bash
        working-directory: qt/build
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          WIN_SIGN_THUMBPRINT: ${{ secrets.WIN_SIGN_THUMBPRINT }}
        run: cpack -G ${{ matrix.cpack_generator }} --verbose

      - name: Notarize (macOS, when secret provisioned)
        if: runner.os == 'macOS' && env.MAC_NOTARIZE_APPLE_ID != ''
        env:
          MAC_NOTARIZE_APPLE_ID: ${{ secrets.MAC_NOTARIZE_APPLE_ID }}
          MAC_NOTARIZE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM_ID }}
          MAC_NOTARIZE_PASSWORD: ${{ secrets.MAC_NOTARIZE_PASSWORD }}
        shell: bash
        working-directory: qt/build
        run: |
          DMG=$(ls QuMesh-*-macos.dmg | head -1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$MAC_NOTARIZE_APPLE_ID" \
            --team-id "$MAC_NOTARIZE_TEAM_ID" \
            --password "$MAC_NOTARIZE_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Collect artifact
        shell: bash
        working-directory: qt/build
        run: |
          mkdir -p ../../artifacts
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp QuMesh-*-macos.dmg ../../artifacts/
          else
            cp QuMesh-*-windows-x64.exe ../../artifacts/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qumesh-${{ runner.os }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: qumesh-macOS
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: qumesh-Windows
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          QuMesh $TAG
          ============

          Native Qt6 console for Intel AMT (vPro) devices.

          - **macOS** — drag QuMesh.app from the .dmg to Applications.
            On first launch Gatekeeper will warn that the bundle is
            unsigned; right-click → Open to bypass.
          - **Windows** — run the .exe installer. SmartScreen will warn
            that the publisher is unverified; click "More info" →
            "Run anyway".

          See [the changelog](https://github.com/${{ github.repository }}/compare/...$TAG)
          for what changed.
          EOF
          gh release create "$TAG" \
            --title "QuMesh $TAG" \
            --notes-file "$NOTES_FILE" \
            dist/*
