#
# Publishes a signed APT repo to GitHub Pages each time the Release
# workflow ships a new tag. The repo layout follows the debian archive
# convention so `apt update` parses it without any special client-side
# configuration:
#
#   /                        (Pages root, https://<owner>.github.io/<repo>/)
#   ├── apt-pub.asc          (ASCII-armored GPG public key — users curl this)
#   ├── pool/main/q/qumesh/  (the .deb files for every arch)
#   └── dists/stable/        (per-suite metadata)
#       ├── InRelease        (clearsigned Release — preferred)
#       ├── Release          (raw Release)
#       ├── Release.gpg      (detached signature — legacy fallback)
#       └── main/
#           ├── binary-amd64/{Packages,Packages.gz}
#           └── binary-arm64/{Packages,Packages.gz}
#
# Pages is configured with Source: GitHub Actions, so each run uploads a
# full site artifact and deploy-pages atomically replaces the previous
# deploy. That's stateless by design — every run reconstructs the
# cumulative .deb pool from scratch by listing every GitHub Release
# tagged `v*` and downloading its .deb assets. GitHub Releases is the
# single source of truth; this workflow just renders metadata over it.
#
# Triggered after Release completes successfully on a tag, or manually
# via workflow_dispatch. Skips silently if APT_SIGNING_KEY isn't
# provisioned (one-time setup documented in PACKAGING.md).

name: APT repo publish

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages requires this concurrency group; a queued deploy supersedes
# any in-flight one for the same environment so a backed-up queue
# doesn't ship a stale snapshot.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble APT repo
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Skip when signing key not provisioned
        id: gate
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "${APT_SIGNING_KEY:-}" ]; then
            echo "::notice::APT_SIGNING_KEY secret is not set; skipping APT publish. See PACKAGING.md for the one-time setup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install repo tools
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            apt-utils gnupg dpkg-dev curl

      - name: Checkout (for apt-pub.asc + the Pages index template)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Download .debs from every v-tagged release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p site/pool/main/q/qumesh
          # Pages-via-Actions deploys are stateless; reconstruct the
          # full pool every run from the source of truth (Releases).
          # `gh release list --limit 100` covers any sane release
          # cadence; bump if we ever ship >100 versions.
          TAGS=$(gh release list \
              --repo "${{ github.repository }}" \
              --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false) | .tagName' \
              | grep -E '^v[0-9]' || true)
          if [ -z "$TAGS" ]; then
            echo "::warning::No v-tagged releases found; APT repo will publish with empty pool."
          fi
          for TAG in $TAGS; do
            echo "::group::Fetching .debs from $TAG"
            # download fails the workflow if no asset matches the
            # pattern — older releases may not have any .deb yet.
            # `|| true` keeps us moving past those.
            gh release download "$TAG" \
                --repo "${{ github.repository }}" \
                --pattern '*.deb' \
                --dir site/pool/main/q/qumesh \
                --skip-existing || true
            echo "::endgroup::"
          done
          ls -la site/pool/main/q/qumesh/ || true

      - name: Import GPG signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -eu
          # The secret is a base64-encoded armored private key. Decode
          # to a file, import, then wipe.
          KEY_FILE=$(mktemp)
          printf '%s' "$APT_SIGNING_KEY" | base64 -d > "$KEY_FILE"
          gpg --batch --import "$KEY_FILE"
          rm -f "$KEY_FILE"
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "GPG_KEYID=$KEYID" >> "$GITHUB_ENV"

      - name: Generate per-arch Packages + Packages.gz
        if: steps.gate.outputs.skip != 'true'
        working-directory: site
        run: |
          set -eux
          # `apt-ftparchive packages` walks the pool, hashes each .deb,
          # and emits a Packages file. Run once per architecture with
          # `--arch=` so each binary-<arch>/Packages only references
          # debs matching that arch; apt clients then ignore packages
          # built for foreign architectures. Run from the site root so
          # the paths inside Packages stay relative — apt joins them
          # to the source-list URL at update time.
          for ARCH in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-${ARCH}"
            apt-ftparchive --arch="${ARCH}" packages pool/main/q/qumesh \
                > "dists/stable/main/binary-${ARCH}/Packages"
            gzip -kf9 "dists/stable/main/binary-${ARCH}/Packages"
            echo "::group::Packages (${ARCH})"
            head -50 "dists/stable/main/binary-${ARCH}/Packages" || true
            echo "::endgroup::"
          done

      - name: Generate Release + InRelease + Release.gpg
        if: steps.gate.outputs.skip != 'true'
        working-directory: site
        run: |
          set -eux
          # apt-ftparchive needs an ad-hoc config to fill in the
          # Origin/Suite/Codename/Components/Architectures headers.
          # Pin the suite to `stable` (single moving target — see
          # issue #254 discussion) so we don't tie users to a specific
          # Debian/Ubuntu codename.
          cat > /tmp/apt-release.conf <<'CFG'
          APT::FTPArchive::Release {
            Origin "QuMesh";
            Label "QuMesh";
            Suite "stable";
            Codename "stable";
            Components "main";
            Architectures "amd64 arm64";
            Description "QuMesh APT repository (Debian / Ubuntu)";
          };
          CFG
          apt-ftparchive -c /tmp/apt-release.conf release dists/stable \
              > dists/stable/Release

          # InRelease = clearsigned (inline signature) — apt's preferred
          # form. Release.gpg = detached signature, kept for any client
          # that still wants it.
          gpg --batch --yes --default-key "$GPG_KEYID" \
              --clearsign --output dists/stable/InRelease \
              dists/stable/Release
          gpg --batch --yes --default-key "$GPG_KEYID" \
              --armor --detach-sign --output dists/stable/Release.gpg \
              dists/stable/Release

      - name: Drop public key + landing page at site root
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -eux
          # apt-pub.asc is committed at branding/apt-pub.asc; copy
          # verbatim so users can `curl https://<owner>.github.io/<repo>/apt-pub.asc`.
          cp branding/apt-pub.asc site/apt-pub.asc

          # Minimal index.html so the bare URL doesn't 404. Mirrors
          # the install snippet from the release body and README.
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>QuMesh APT repository</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 720px;
                     margin: 3rem auto; padding: 0 1rem; color: #1e293b; }
              code, pre { font-family: ui-monospace, monospace;
                          background: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 4px; }
              pre { padding: 1rem; overflow-x: auto; }
              a { color: #38bdf8; }
            </style>
          </head>
          <body>
            <h1>QuMesh APT repository</h1>
            <p>Static APT repo for
              <a href="https://github.com/${{ github.repository }}">QuMesh</a>,
              covering Debian 13 and Ubuntu 26.04 on amd64 and arm64.</p>
            <h2>Add the repository</h2>
            <pre>curl -fsSL https://${REPO_OWNER}.github.io/${REPO_NAME}/apt-pub.asc | \\
            sudo tee /etc/apt/keyrings/qumesh.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/qumesh.asc] \\
            https://${REPO_OWNER}.github.io/${REPO_NAME} stable main" | \\
            sudo tee /etc/apt/sources.list.d/qumesh.list
          sudo apt update
          sudo apt install qumesh</pre>
            <p>Signing key: <a href="apt-pub.asc">apt-pub.asc</a>.
               Metadata: <a href="dists/stable/">dists/stable/</a>.
               Pool: <a href="pool/main/q/qumesh/">pool/main/q/qumesh/</a>.</p>
          </body>
          </html>
          HTML

      - name: Configure Pages
        if: steps.gate.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
