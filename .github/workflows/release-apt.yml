#
# Publishes a signed APT repo to GitHub Pages each time the Release
# workflow ships a new tag. The repo is split per Debian/Ubuntu
# distribution because the same upstream version (e.g. 1.2.0) ships
# four .debs — Ubuntu 26.04 amd64/arm64 and Debian 13 amd64/arm64 —
# and apt would otherwise see them as duplicates inside a single
# suite. Layout:
#
#   /                              (Pages root, https://<owner>.github.io/<repo>/)
#   ├── apt-pub.asc                (ASCII-armored GPG public key — users curl this)
#   ├── index.html                 (install snippet)
#   ├── pool/
#   │   ├── ubuntu26.04/main/q/qumesh/qumesh_<ver>-ubuntu26.04_<arch>.deb
#   │   └── debian13/main/q/qumesh/qumesh_<ver>-debian13_<arch>.deb
#   └── dists/
#       ├── ubuntu26.04/
#       │   ├── InRelease   Release   Release.gpg
#       │   └── main/binary-{amd64,arm64}/{Packages,Packages.gz}
#       └── debian13/
#           ├── InRelease   Release   Release.gpg
#           └── main/binary-{amd64,arm64}/{Packages,Packages.gz}
#
# Triggered after Release completes successfully on a tag. Skips
# silently if APT_SIGNING_KEY isn't provisioned (one-time maintainer
# setup is documented in PACKAGING.md).

name: APT repo publish

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Distros the repo serves. Adding a new one is: extend this list, add
# a matching build entry to release.yml, push.
env:
  DISTROS: 'ubuntu26.04 debian13'
  ARCHES: 'amd64 arm64'

jobs:
  build:
    name: Assemble APT repo
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Skip when signing key not provisioned
        id: gate
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "${APT_SIGNING_KEY:-}" ]; then
            echo "::notice::APT_SIGNING_KEY secret is not set; skipping APT publish. See PACKAGING.md for the one-time setup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install repo tools
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            apt-utils gnupg dpkg-dev curl

      - name: Checkout (for apt-pub.asc + the Pages index template)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Download .debs from every v-tagged release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p incoming
          # Pages-via-Actions deploys are stateless; rebuild the full
          # pool every run from the source of truth (GitHub Releases).
          # 100-release cap matches any sane release cadence; bump if
          # we ever blow past it.
          TAGS=$(gh release list \
              --repo "${{ github.repository }}" \
              --limit 100 \
              --json tagName,isDraft \
              --jq '.[] | select(.isDraft == false) | .tagName' \
              | grep -E '^v[0-9]' || true)
          if [ -z "$TAGS" ]; then
            echo "::warning::No v-tagged releases found; APT repo will publish with empty pool."
          fi
          for TAG in $TAGS; do
            echo "::group::Fetching .debs from $TAG"
            gh release download "$TAG" \
                --repo "${{ github.repository }}" \
                --pattern '*.deb' \
                --dir incoming \
                --skip-existing || true
            echo "::endgroup::"
          done
          ls -la incoming/ || true

      - name: Stage .debs into per-distro pools
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -eux
          # Filenames carry the distro tag (qumesh_<ver>-<distro>_<arch>.deb),
          # which is what routes each file to its pool. A .deb that
          # doesn't match the convention (legacy or hand-built) gets
          # logged and skipped — better than silently mis-shelving it.
          for DISTRO in $DISTROS; do
            mkdir -p "site/pool/${DISTRO}/main/q/qumesh"
          done
          UNROUTED=0
          for DEB in incoming/*.deb; do
            [ -f "$DEB" ] || continue
            ROUTED=
            for DISTRO in $DISTROS; do
              case "$(basename "$DEB")" in
                qumesh_*-${DISTRO}_*.deb)
                  cp "$DEB" "site/pool/${DISTRO}/main/q/qumesh/"
                  ROUTED=1
                  break
                  ;;
              esac
            done
            if [ -z "$ROUTED" ]; then
              echo "::warning::Skipping $DEB — filename doesn't match any '-<distro>_' tag we publish ($DISTROS)."
              UNROUTED=$((UNROUTED + 1))
            fi
          done
          echo "Unrouted .debs: $UNROUTED"
          for DISTRO in $DISTROS; do
            echo "::group::pool/${DISTRO}/main/q/qumesh/"
            ls -la "site/pool/${DISTRO}/main/q/qumesh/" || true
            echo "::endgroup::"
          done

      - name: Import GPG signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -eu
          KEY_FILE=$(mktemp)
          printf '%s' "$APT_SIGNING_KEY" | base64 -d > "$KEY_FILE"
          gpg --batch --import "$KEY_FILE"
          rm -f "$KEY_FILE"
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "GPG_KEYID=$KEYID" >> "$GITHUB_ENV"

      - name: Build per-distro metadata
        if: steps.gate.outputs.skip != 'true'
        working-directory: site
        run: |
          set -eux
          for DISTRO in $DISTROS; do
            for ARCH in $ARCHES; do
              # Filename: in the Packages stanza is relative to the
              # Pages root, so apt resolves it against the source-list
              # URL at update time. Generate from the per-distro pool
              # so each suite only references its own files.
              DEST="dists/${DISTRO}/main/binary-${ARCH}"
              mkdir -p "$DEST"
              apt-ftparchive --arch="${ARCH}" packages \
                  "pool/${DISTRO}/main/q/qumesh" \
                  > "${DEST}/Packages"
              gzip -kf9 "${DEST}/Packages"
              echo "::group::Packages (${DISTRO}/${ARCH})"
              head -50 "${DEST}/Packages" || true
              echo "::endgroup::"
            done

            # Per-distro Release file. Codename matches the suite name
            # users put in their sources.list line, so it's the same
            # string everywhere.
            cat > /tmp/apt-release.conf <<CFG
          APT::FTPArchive::Release {
            Origin "QuMesh";
            Label "QuMesh";
            Suite "${DISTRO}";
            Codename "${DISTRO}";
            Components "main";
            Architectures "amd64 arm64";
            Description "QuMesh APT repository (${DISTRO})";
          };
          CFG
            apt-ftparchive -c /tmp/apt-release.conf release \
                "dists/${DISTRO}" > "dists/${DISTRO}/Release"

            # InRelease = clearsigned (inline signature) — apt's
            # preferred form. Release.gpg = detached, kept for any
            # client that still wants it.
            gpg --batch --yes --default-key "$GPG_KEYID" \
                --clearsign --output "dists/${DISTRO}/InRelease" \
                "dists/${DISTRO}/Release"
            gpg --batch --yes --default-key "$GPG_KEYID" \
                --armor --detach-sign \
                --output "dists/${DISTRO}/Release.gpg" \
                "dists/${DISTRO}/Release"
          done

      - name: Drop public key + landing page at site root
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -eux
          cp branding/apt-pub.asc site/apt-pub.asc

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>QuMesh APT repository</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 760px;
                     margin: 3rem auto; padding: 0 1rem; color: #1e293b; }
              code, pre { font-family: ui-monospace, monospace;
                          background: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 4px; }
              pre { padding: 1rem; overflow-x: auto; }
              a { color: #38bdf8; }
            </style>
          </head>
          <body>
            <h1>QuMesh APT repository</h1>
            <p>Signed APT repo for
              <a href="https://github.com/${{ github.repository }}">QuMesh</a>,
              covering Debian 13 and Ubuntu 26.04 on amd64 and arm64.</p>
            <h2>Add the repository</h2>
            <p>The suite name matches your distro + version
              (<code>ubuntu26.04</code> or <code>debian13</code>); the snippet
              below picks the right one from <code>/etc/os-release</code> on
              the host.</p>
            <pre>. /etc/os-release   # sets ID + VERSION_ID
          SUITE="\${ID}\${VERSION_ID}"

          curl -fsSL https://${REPO_OWNER}.github.io/${REPO_NAME}/apt-pub.asc | \\
            sudo tee /etc/apt/keyrings/qumesh.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/qumesh.asc] \\
            https://${REPO_OWNER}.github.io/${REPO_NAME} \$SUITE main" | \\
            sudo tee /etc/apt/sources.list.d/qumesh.list
          sudo apt update
          sudo apt install qumesh</pre>
            <p>Signing key: <a href="apt-pub.asc">apt-pub.asc</a>.</p>
            <p>Direct browsing:
              <a href="dists/">dists/</a> &middot;
              <a href="pool/">pool/</a>.</p>
          </body>
          </html>
          HTML

      - name: Configure Pages
        if: steps.gate.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
