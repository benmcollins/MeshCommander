name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools'
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Install libssh (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libssh
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libssh)${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> $GITHUB_ENV

      # Forward the GHA cache service URL + runtime token so vcpkg's
      # `x-gha` binary-source provider can talk to it from the bash
      # shell. These env vars are normally only exposed to JavaScript
      # actions; github-script re-exports them via core.exportVariable
      # so subsequent steps (incl. the vcpkg install below) inherit
      # them. See #190.
      - name: Export GHA cache env for vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install libssh + openssl via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          # `x-gha,readwrite` uploads built binaries to the GitHub
          # Actions cache and pulls them back on subsequent runs keyed
          # by abi-hash. First run after a vcpkg or registry bump
          # populates the cache (~10 min); cache hits drop the install
          # to seconds. See #190.
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        run: |
          # Install OpenSSL through vcpkg alongside libssh — the
          # alternative is the chocolatey-installed OpenSSL at
          # C:/Program Files/OpenSSL-Win64, which lives in a different
          # ABI from the OpenSSL vcpkg's libssh was built against.
          # Unifying through vcpkg also lets the binary cache cover
          # OpenSSL on top of libssh.
          /c/vcpkg/vcpkg.exe install openssl:x64-windows libssh:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=x64-windows" >> $GITHUB_ENV

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        working-directory: build
        run: ctest --output-on-failure --parallel
