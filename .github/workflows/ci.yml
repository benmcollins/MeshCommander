name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools'
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Locate OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # OpenSSL 3 is pre-installed on windows-latest via chocolatey.
          if [ -d "/c/Program Files/OpenSSL-Win64" ]; then
            echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL-Win64" >> $GITHUB_ENV
          elif [ -d "/c/Program Files/OpenSSL" ]; then
            echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL" >> $GITHUB_ENV
          else
            echo "Could not locate a pre-installed OpenSSL; installing via choco" >&2
            choco install -y --no-progress openssl
            echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL-Win64" >> $GITHUB_ENV
          fi

      - name: Configure
        shell: bash
        working-directory: qt
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        working-directory: qt
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        working-directory: qt/build
        run: ctest --output-on-failure --parallel
