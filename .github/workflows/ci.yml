name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools'
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Install libssh (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libssh
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libssh)${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> $GITHUB_ENV

      # Fetch the prebuilt openssl + libssh tarball published by
      # `.github/workflows/build-windeps.yml` to a `windeps-vN`
      # release. This replaces a ~10 min `vcpkg install` per run with
      # a ~5 s `curl + tar`. Bump WINDEPS_TAG + WINDEPS_SHA256 in
      # lockstep with a re-run of build-windeps.yml when the bundled
      # openssl / libssh need a refresh. See #196.
      - name: Fetch prebuilt openssl + libssh (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDEPS_TAG: windeps-v1
          WINDEPS_SHA256: 187cf10bc46c282ae231c772f559587e92c18c4a2e8db6ff08462e7bc315c4c4
        run: |
          set -euo pipefail
          # $RUNNER_TEMP on windows-latest comes in as a native Windows
          # path (`D:\a\_temp`). Git-bash's tar interprets the `D:` as
          # a `host:path` remote spec and the backslashes as escapes,
          # so it can never find a `-C` target. Forward-slash the path
          # and pair with `--force-local` to neutralise both halves.
          RT="${RUNNER_TEMP//\\//}"
          VERSION=${WINDEPS_TAG#windeps-}
          URL="https://github.com/${{ github.repository }}/releases/download/${WINDEPS_TAG}/qumesh-windeps-x64-windows-${VERSION}.tar.gz"
          curl -sSL "$URL" -o "$RT/windeps.tar.gz"
          echo "$WINDEPS_SHA256  $RT/windeps.tar.gz" | sha256sum -c -
          mkdir -p "$RT/windeps"
          tar --force-local -xzf "$RT/windeps.tar.gz" -C "$RT/windeps"
          # build-windeps.yml drops the debug build tree to halve the
          # tarball, but libssh's exported CMake config still imports
          # the debug-variant config file alongside the release one,
          # and that debug config references `debug/lib/ssh.lib` —
          # which no longer exists, so `find_package(libssh CONFIG …)`
          # bails. Remove the debug-config stub so only release loads.
          rm -f "$RT/windeps/x64-windows/share/libssh/libssh-config-debug.cmake"
          # The tarball opens to a single top-level x64-windows/ tree
          # in the same layout as vcpkg's install prefix, so CMake's
          # `find_package(OpenSSL …)` and `find_package(libssh CONFIG
          # REQUIRED)` resolve once CMAKE_PREFIX_PATH points there.
          # No vcpkg toolchain file needed.
          echo "CMAKE_PREFIX_PATH=$RT/windeps/x64-windows" >> $GITHUB_ENV

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: build
        run: ctest --output-on-failure --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: build
        run: |
          rem Windows test exes import ssh.dll / libcrypto-3-x64.dll
          rem dynamically and the dynamic loader needs them on PATH.
          rem The bash-shell trick from earlier never propagated cleanly
          rem through git-bash's POSIX→Win32 PATH translation, so do
          rem the prepend in native cmd where %PATH% already uses ;
          rem and Windows-form drive letters.
          set "PATH=%RUNNER_TEMP%\windeps\x64-windows\bin;%PATH%"
          ctest --output-on-failure --parallel

      # #262 diagnostic. test_qml_engine_loads on Windows fails with
      # zero captured ctest output (process terminates before stdout
      # is flushed). The test writes structured progress to
      # `<test-dir>/test_qml_engine_loads.diag.log` from main(); print
      # it on test failure so we can tell whether main() was reached.
      # Remove once the underlying bug is fixed.
      - name: Dump #262 diagnostic log (Windows)
        if: runner.os == 'Windows' && failure()
        shell: cmd
        working-directory: build
        run: |
          dir /S /B test_qml_engine_loads.diag.log 2>nul && (
            for /R %%f in (test_qml_engine_loads.diag.log) do (
              echo === %%f ===
              type "%%f"
            )
          ) || (
            echo "(no diag log produced — main() was not reached)"
          )

  # Mirrors the matrix used by release.yml's `build-linux` job so PRs
  # catch the two regressions that are easy to introduce when only
  # macOS/Windows are tested at PR time:
  #
  #   1. CPack-DEB shipping bundled Qt instead of using package deps
  #      (the bug behind #256 — the .deb tripled in size and
  #      collided with the distro's own /usr/lib/<triplet>/qt6/
  #      paths). The dpkg-deb step at the bottom is the guard.
  #   2. arm64-only build breaks. install-qt-action's Linux prebuilt
  #      is amd64-only, so previously CI couldn't compile-check arm64.
  #      Now we use the distro's apt-installed Qt inside an arm64
  #      container on GH's native arm runners.
  build-linux:
    name: Build & test (${{ matrix.distro_label }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ${{ matrix.container_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container_image: 'ubuntu:26.04'
            distro_label: 'Ubuntu 26.04'
            arch: amd64
            runs_on: ubuntu-latest
          - container_image: 'ubuntu:26.04'
            distro_label: 'Ubuntu 26.04'
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - container_image: 'debian:13'
            distro_label: 'Debian 13'
            arch: amd64
            runs_on: ubuntu-latest
          - container_image: 'debian:13'
            distro_label: 'Debian 13'
            arch: arm64
            runs_on: ubuntu-24.04-arm

    steps:
      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git ca-certificates curl \
            cmake ninja-build build-essential \
            python3 file \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-tools-dev \
            libqt6svg6-dev \
            libssh-dev libssl-dev \
            dpkg-dev

      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --parallel

      - name: Package (.deb)
        shell: bash
        working-directory: build
        run: cpack -G DEB --verbose

      - name: Verify .deb doesn't bundle Qt
        shell: bash
        working-directory: build
        run: |
          set -eux
          DEB=$(ls qumesh_*.deb | head -1)
          if dpkg-deb -c "$DEB" | grep -q '/qt6/'; then
            echo "::error::$DEB contains /qt6/ paths — Qt is being bundled (#256)."
            dpkg-deb -c "$DEB" | grep '/qt6/'
            exit 1
          fi
          # Log the resolved deps so the run output makes the Qt-via-
          # shlibdeps wiring auditable at a glance.
          dpkg-deb -f "$DEB" Depends
