<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>QuMesh</title>
  <desc>QuMesh application mark — a Q formed from a circle with lattice nodes and a connection tail to a remote node.</desc>
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="currentColor" stroke-width="4"/>
    <circle cx="-50" cy="0" r="5" fill="currentColor"/>
    <circle cx="50" cy="0" r="5" fill="currentColor"/>
    <circle cx="0" cy="-50" r="5" fill="currentColor"/>
    <circle cx="0" cy="50" r="5" fill="currentColor"/>
    <circle cx="-35.355" cy="-35.355" r="5" fill="currentColor"/>
    <circle cx="35.355" cy="-35.355" r="5" fill="currentColor"/>
    <circle cx="-35.355" cy="35.355" r="5" fill="currentColor"/>
    <circle cx="35.355" cy="35.355" r="5" fill="currentColor"/>
    <line x1="20" y1="20" x2="55" y2="55" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <circle cx="55" cy="55" r="7" fill="currentColor"/>
  </g>
</svg>
