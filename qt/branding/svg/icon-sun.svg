<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Sun — switch to light theme</title>
  <desc>Sun glyph used in the QuMesh title bar to indicate the toggle to the light theme. Rays + body share currentColor so the icon picks up the surrounding text colour.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <line x1="12" y1="2.5" x2="12" y2="5"/>
    <line x1="12" y1="19" x2="12" y2="21.5"/>
    <line x1="2.5" y1="12" x2="5" y2="12"/>
    <line x1="19" y1="12" x2="21.5" y2="12"/>
    <line x1="5.2" y1="5.2" x2="6.9" y2="6.9"/>
    <line x1="17.1" y1="17.1" x2="18.8" y2="18.8"/>
    <line x1="5.2" y1="18.8" x2="6.9" y2="17.1"/>
    <line x1="17.1" y1="6.9" x2="18.8" y2="5.2"/>
  </g>
</svg>
